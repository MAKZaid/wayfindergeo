/* The 404 page: the hero's night sky and the round-four telescope in light ink, sweeping the sky for the page, its sight line ending in a question mark;
   one button home. Self-contained; paths are from the site root because this page is served at
   any address. Reduced motion: nothing moves. */
@font-face{font-family:'Inter';font-style:normal;font-weight:300 700;font-display:swap;src:url(/assets/fonts/inter-var.woff2) format('woff2')}
@font-face{font-family:'Fraunces';font-style:normal;font-weight:300;font-display:swap;src:url(/assets/fonts/fraunces-300.woff2) format('woff2')}
@font-face{font-family:'Fraunces';font-style:italic;font-weight:300;font-display:swap;src:url(/assets/fonts/fraunces-300-italic.woff2) format('woff2')}
:root{--ink:#1c1408;--paper:#fffdf8;--sand:#f4e8d3;--muted:#c9b492;--ember:#d0631c;--flame:#c2521a;--glow:#f29a55;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100svh;display:flex;flex-direction:column;background:radial-gradient(120% 80% at 50% 0%,#2b2013 0%,#1c1408 45%,#120d07 100%);
  color:var(--paper);font:400 17px/1.6 Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:-50%;background:url(/assets/img/grain.png) repeat;opacity:.1;pointer-events:none;z-index:0}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.sky i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff5e6;opacity:var(--o);animation:tw var(--d) ease-in-out infinite var(--dl)}
@keyframes tw{50%{opacity:calc(var(--o) * .25)}}
header,main,footer{position:relative;z-index:1;width:100%;max-width:1120px;margin:0 auto}
header{padding-top:max(28px,env(safe-area-inset-top,0px))}
header a{display:inline-flex;padding:8px 0}
header img{display:block;height:30px;width:auto}
main{flex:1;display:grid;justify-items:center;align-content:center;gap:0;padding:clamp(32px,5vh,64px) 0 clamp(40px,6vh,72px);text-align:center}
.art{width:min(300px,74vw);height:auto;margin-bottom:clamp(28px,4.5vh,44px);overflow:visible}
.big{margin:0 0 clamp(14px,2vh,22px);font:700 clamp(3rem,2.2rem + 2.6vw,4.5rem)/1 Inter,system-ui,sans-serif;letter-spacing:-.05em;
  background:linear-gradient(100deg,#ffc08a 0%,#f58a45 35%,#e2622a 70%,#c8471c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  padding:0 .06em .04em}
.eyebrow{display:inline-flex;align-items:center;gap:10px;margin:0 0 14px;font:600 .8rem/1 Inter,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--glow)}
.eyebrow::before{content:"";width:7px;height:7px;background:var(--ember);border-radius:1px}
h1{margin:0;font:300 clamp(2.3rem,1.4rem + 3.2vw,3.6rem)/1.06 Fraunces,Georgia,serif;letter-spacing:-.02em;text-wrap:balance;max-width:14ch}
h1 em{font-style:italic;color:var(--glow)}
.lead{margin:clamp(20px,2.6vh,28px) 0 0;max-width:34rem;color:#e7dcc9;text-wrap:balance}
@media (min-width:480px){.nw{white-space:nowrap}}
@media (min-width:900px){.lead{max-width:none}}
.acts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:clamp(32px,4.5vh,48px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:12px;font:600 1rem/1 Inter,system-ui,sans-serif;text-decoration:none;
  transition:transform .18s cubic-bezier(.2,.8,.2,1),background .25s ease,border-color .25s ease}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
.solid{color:#fff;background:linear-gradient(180deg,#d4632b 0%,#c2521a 55%,#b5480f 100%);border:1px solid #a3400e;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 16px -8px rgba(194,82,26,.8)}
.solid:hover{background:linear-gradient(180deg,#db6d34 0%,#c85920 55%,#b84b12 100%)}
.ghost{color:var(--paper);background:linear-gradient(180deg,rgba(255,253,248,.13) 0%,rgba(255,253,248,.04) 100%);border:1px solid rgba(255,253,248,.2);box-shadow:inset 0 1px 0 rgba(255,253,248,.18)}
.ghost:hover{border-color:rgba(255,253,248,.34)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 22px;margin:26px 0 0;padding:0;list-style:none}
.links a{display:inline-block;padding:10px 2px;color:var(--muted);text-decoration:none;font-size:.95rem}
.links a:hover{color:var(--paper)}
footer{padding:0 0 max(28px,env(safe-area-inset-bottom,0px));text-align:center;font-size:.8rem;color:#8f7d63}
/* the doodle: the telescope sweeps slowly round its mount, the sight line flows, the ? bobs, the stars twinkle */
.scope{transform-origin:162px 166px;animation:sweep 7s cubic-bezier(.45,0,.25,1) infinite}
@keyframes sweep{0%,100%{transform:rotate(0)}30%{transform:rotate(-14deg)}38%{transform:rotate(-14deg)}68%{transform:rotate(9deg)}76%{transform:rotate(9deg)}}
.sight{animation:walk 1.6s linear infinite}
@keyframes walk{to{stroke-dashoffset:-16}}
.qm{transform-box:fill-box;transform-origin:center;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(6deg)}}
.t1,.t2,.t3{animation:tw2 3.6s ease-in-out infinite}.t2{animation-delay:-1.2s}.t3{animation-delay:-2.4s}
@keyframes tw2{50%{opacity:.25}}
.planet{transform-origin:72px 92px;animation:drift 9s ease-in-out infinite}
@keyframes drift{50%{transform:translate(3px,-3px)}}
@media (prefers-reduced-motion:reduce){.sky i,.scope,.sight,.qm,.t1,.t2,.t3,.planet{animation:none}}
@media (max-width:480px){.acts{display:grid;width:100%;max-width:330px}}
@media (max-height:700px) and (min-width:600px){main{padding:12px 0 28px}.art{width:190px;margin-bottom:18px}.big{font-size:3rem;margin-bottom:10px}h1{font-size:2.6rem}.acts{margin-top:28px}}
</style>
</head>
